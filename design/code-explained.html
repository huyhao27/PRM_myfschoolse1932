<script type="text/plain" id="f-main" data-name="main.dart" data-path="lib/main.dart" data-intro="Điểm khởi động của app. Dart chạy hàm main đầu tiên, rồi mở màn hình đăng nhập.">
import 'package:flutter/material.dart'; ¦ Nạp thư viện Material của Flutter (có sẵn nút, ô nhập, thanh tiêu đề, theme...)
import 'screen/login_screen.dart'; ¦ Nạp file màn hình đăng nhập để dùng class LoginScreen bên dưới

void main() { ¦ Hàm main: nơi chương trình bắt đầu chạy
  runApp(const MyApp()); ¦ runApp đưa widget MyApp lên màn hình. const nghĩa là đối tượng này không bao giờ đổi
} ¦ Hết hàm main

class MyApp extends StatelessWidget { ¦ MyApp là widget gốc. StatelessWidget = giao diện cố định, không có dữ liệu thay đổi
  const MyApp({super.key}); ¦ Hàm khởi tạo. super.key chuyển key cho class cha để Flutter nhận diện widget

  @override ¦ Báo rằng hàm bên dưới ghi đè hàm có sẵn của class cha
  Widget build(BuildContext context) { ¦ build trả về giao diện của widget. context cho biết vị trí widget trong cây giao diện
    return MaterialApp( ¦ MaterialApp là khung app theo phong cách Material (quản lý theme, điều hướng)
      title: 'MyFSchool', ¦ Tên app, hệ điều hành dùng để hiển thị trong danh sách ứng dụng đang mở
      debugShowCheckedModeBanner: false, ¦ Tắt nhãn "DEBUG" ở góc phải màn hình
      theme: ThemeData( ¦ Cấu hình giao diện chung cho cả app
        colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF1877F2)), ¦ Từ một màu gốc (xanh Facebook) Flutter tự sinh cả bộ màu. 0xFF là độ đục 100%, 1877F2 là mã màu
        useMaterial3: true, ¦ Bật kiểu giao diện Material 3 (mới hơn)
      ), ¦ Hết ThemeData
      home: const LoginScreen(), ¦ Màn hình đầu tiên khi mở app là LoginScreen
    ); ¦ Hết MaterialApp
  } ¦ Hết hàm build
} ¦ Hết class MyApp
</script>

<script type="text/plain" id="f-validators" data-name="validators.dart" data-path="lib/screen/validators.dart" data-intro="Hàm kiểm tra email hoặc số điện thoại, dùng chung cho Login và Sign Up. Quy ước: hợp lệ thì trả về null, sai thì trả về câu báo lỗi.">
// Returns null when the input is valid, otherwise the error message. ¦ Comment (tiếng Anh) đặt trên đầu hàm: giải thích quy ước trả về
String? validateEmailOrPhone(String? value) { ¦ Nhận chuỗi người dùng nhập (có thể null), trả về String? (null nếu ổn, hoặc câu lỗi)
  final text = value?.trim() ?? ''; ¦ Bỏ khoảng trắng hai đầu. Nếu value là null thì dùng chuỗi rỗng

  if (text.isEmpty) { ¦ Nếu người dùng chưa nhập gì
    return 'Enter your mobile number or email'; ¦ Trả về lời nhắc, Flutter sẽ hiện chữ đỏ dưới ô nhập
  } ¦ Hết if

  // Phone: 9-11 digits, optional leading + ¦ Comment ngắn mô tả quy tắc của regex bên dưới
  final isPhone = RegExp(r'^\+?\d{9,11}$').hasMatch(text); ¦ Kiểm tra số điện thoại: ^ đầu chuỗi, \+? có thể có dấu +, \d{9,11} từ 9 đến 11 chữ số, $ cuối chuỗi

  // Email: name@domain.tld ¦ Comment ngắn mô tả quy tắc của regex bên dưới
  final isEmail = RegExp(r'^[\w.+-]+@[\w-]+(\.[\w-]+)+$').hasMatch(text); ¦ Kiểm tra email: phần tên, dấu @, tên miền, rồi ít nhất một đuôi như .com

  if (!isPhone && !isEmail) { ¦ Nếu không phải số điện thoại và cũng không phải email
    return 'Enter a valid email address or mobile number'; ¦ Báo lỗi định dạng
  } ¦ Hết if
  return null; ¦ Hợp lệ thì trả null, nghĩa là "không có lỗi"
} ¦ Hết hàm
</script>

<script type="text/plain" id="f-home" data-name="home_screen.dart" data-path="lib/screen/home_screen.dart" data-intro="Trang chủ hiện sau khi đăng nhập thành công. Nhận email từ màn hình trước để hiển thị.">
import 'package:flutter/material.dart'; ¦ Nạp thư viện Material
import 'login_screen.dart'; ¦ Nạp màn hình đăng nhập để nút đăng xuất quay về đó

class HomeScreen extends StatelessWidget { ¦ Màn hình tĩnh: nội dung không tự thay đổi nên dùng StatelessWidget
  const HomeScreen({super.key, required this.email}); ¦ Hàm khởi tạo. required this.email bắt buộc truyền email khi tạo màn hình

  final String email; ¦ Lưu email nhận được. final = gán một lần, không đổi

  @override ¦ Ghi đè hàm của class cha
  Widget build(BuildContext context) { ¦ Hàm dựng giao diện
    return Scaffold( ¦ Scaffold là bộ khung trang: có AppBar, thân trang, nút nổi...
      appBar: AppBar( ¦ Thanh tiêu đề phía trên
        title: const Text('Home'), ¦ Chữ tiêu đề
        actions: [ ¦ Danh sách nút nằm bên phải thanh tiêu đề
          IconButton( ¦ Nút bấm hình icon
            icon: const Icon(Icons.logout), ¦ Icon đăng xuất có sẵn của Flutter
            onPressed: () { ¦ Hàm chạy khi bấm nút
              Navigator.pushReplacement( ¦ Chuyển sang trang khác và thay thế trang hiện tại, bấm Back sẽ không quay lại Home
                context, ¦ Vị trí hiện tại, Navigator cần để biết đang ở đâu
                MaterialPageRoute(builder: (_) => const LoginScreen()), ¦ Tạo trang mới là LoginScreen. Dấu _ là tham số không dùng tới
              ); ¦ Hết pushReplacement
            }, ¦ Hết hàm onPressed
          ), ¦ Hết IconButton
        ], ¦ Hết danh sách actions
      ), ¦ Hết AppBar
      body: Center( ¦ Thân trang: Center đặt nội dung ở giữa
        child: Column( ¦ Column xếp các widget con theo chiều dọc
          mainAxisSize: MainAxisSize.min, ¦ Cột chỉ cao vừa đủ nội dung, không giãn hết màn hình
          children: [ ¦ Danh sách widget con
            const Icon(Icons.check_circle, color: Colors.green, size: 72), ¦ Icon dấu tích tròn, màu xanh lá, cỡ 72
            const SizedBox(height: 16), ¦ Khoảng trống cao 16 để tách các phần
            const Text('Login successful!', style: TextStyle(fontSize: 22)), ¦ Dòng chữ thông báo, cỡ chữ 22
            const SizedBox(height: 8), ¦ Khoảng trống cao 8
            Text(email), ¦ Hiện email nhận được từ màn hình trước
          ], ¦ Hết children
        ), ¦ Hết Column
      ), ¦ Hết Center
    ); ¦ Hết Scaffold
  } ¦ Hết hàm build
} ¦ Hết class HomeScreen
</script>

<script type="text/plain" id="f-login" data-name="login_screen.dart" data-path="lib/screen/login_screen.dart" data-intro="Màn hình đăng nhập. Là StatefulWidget vì có dữ liệu thay đổi (ẩn hoặc hiện mật khẩu). Phần trên cuộn được, nút Create new account luôn nằm ở đáy.">
import 'package:flutter/material.dart'; ¦ Nạp thư viện Material

import 'app_colors.dart'; ¦ Nạp bảng màu
import 'home_screen.dart'; ¦ Nạp trang chủ để chuyển tới sau khi đăng nhập
import 'signup_screen.dart'; ¦ Nạp màn hình đăng ký
import 'validators.dart'; ¦ Nạp hàm kiểm tra email / số điện thoại

class LoginScreen extends StatefulWidget { ¦ StatefulWidget: giao diện có thể đổi theo dữ liệu (state)
  const LoginScreen({super.key}); ¦ Hàm khởi tạo

  @override ¦ Ghi đè hàm của class cha
  State<LoginScreen> createState() => _LoginScreenState(); ¦ Tạo đối tượng State chứa dữ liệu. Dấu _ đầu tên = chỉ dùng trong file này
} ¦ Hết class LoginScreen

class _LoginScreenState extends State<LoginScreen> { ¦ Class State: nơi lưu dữ liệu và dựng giao diện
  final _formKey = GlobalKey<FormState>(); ¦ Chìa khóa của Form, dùng để gọi validate() kiểm tra tất cả ô cùng lúc
  final _emailController = TextEditingController(); ¦ Bộ điều khiển ô email: đọc chữ người dùng gõ
  final _passwordController = TextEditingController(); ¦ Bộ điều khiển ô mật khẩu
  bool _hidePassword = true; ¦ true = mật khẩu đang bị che bằng dấu chấm

  @override ¦ Ghi đè hàm của class cha
  void dispose() { ¦ dispose chạy khi màn hình bị đóng
    _emailController.dispose(); ¦ Giải phóng controller email để không tốn bộ nhớ
    _passwordController.dispose(); ¦ Giải phóng controller mật khẩu
    super.dispose(); ¦ Gọi dispose của class cha để dọn nốt phần còn lại
  } ¦ Hết dispose

  // Goes to the home screen only if every field is valid. ¦ Comment đầu hàm: nói hàm này làm gì
  void _logIn() { ¦ Hàm xử lý khi bấm nút Log in
    if (_formKey.currentState!.validate()) { ¦ Kiểm tra mọi ô trong Form. Dấu ! khẳng định currentState không null. Trả true nếu tất cả hợp lệ
      Navigator.pushReplacement( ¦ Chuyển trang và thay thế trang hiện tại (Back không quay về Login)
        context, ¦ Vị trí hiện tại trong cây giao diện
        MaterialPageRoute( ¦ Tạo một trang mới có hiệu ứng chuyển
          builder: (_) => HomeScreen(email: _emailController.text.trim()), ¦ Dựng HomeScreen và truyền email (đã bỏ khoảng trắng) sang
        ), ¦ Hết MaterialPageRoute
      ); ¦ Hết pushReplacement
    } ¦ Hết if
  } ¦ Hết _logIn

  // Shared style for the text fields. ¦ Comment đầu hàm: kiểu ô nhập dùng chung
  InputDecoration _inputStyle(String label, {Widget? suffix}) { ¦ Hàm tạo kiểu ô nhập dùng chung cho 2 ô. suffix là widget tùy chọn ở cuối ô
    return InputDecoration( ¦ InputDecoration mô tả hình dáng ô nhập
      labelText: label, ¦ Nhãn nổi trong ô
      labelStyle: const TextStyle(color: AppColors.textGray), ¦ Nhãn màu xám
      suffixIcon: suffix, ¦ Widget ở cuối ô (ở đây là nút Show/Hide)
      contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 18), ¦ Khoảng đệm trong ô: ngang 16, dọc 18
      border: OutlineInputBorder( ¦ Viền mặc định
        borderRadius: BorderRadius.circular(8), ¦ Bo góc 8
        borderSide: const BorderSide(color: AppColors.border), ¦ Viền màu xám nhạt
      ), ¦ Hết border
      enabledBorder: OutlineInputBorder( ¦ Viền khi ô đang bình thường (chưa bấm vào)
        borderRadius: BorderRadius.circular(8), ¦ Bo góc 8
        borderSide: const BorderSide(color: AppColors.border), ¦ Viền xám nhạt
      ), ¦ Hết enabledBorder
      focusedBorder: OutlineInputBorder( ¦ Viền khi đang bấm vào ô
        borderRadius: BorderRadius.circular(8), ¦ Bo góc 8
        borderSide: const BorderSide(color: AppColors.blue, width: 1.5), ¦ Viền xanh, dày 1.5 để nổi bật
      ), ¦ Hết focusedBorder
    ); ¦ Hết InputDecoration
  } ¦ Hết _inputStyle

  @override ¦ Ghi đè hàm của class cha
  Widget build(BuildContext context) { ¦ Dựng giao diện. Chạy lại mỗi khi gọi setState
    return Scaffold( ¦ Bộ khung trang
      backgroundColor: Colors.white, ¦ Nền trắng
      body: SafeArea( ¦ SafeArea tránh vùng tai thỏ, thanh trạng thái
        child: Padding( ¦ Padding thêm khoảng đệm quanh nội dung
          padding: const EdgeInsets.symmetric(horizontal: 24), ¦ Đệm hai bên trái phải 24
          child: Column( ¦ Cột chính xếp dọc: phần trên cuộn được, phần dưới cố định
            children: [ ¦ Danh sách widget con
              Expanded( ¦ Expanded chiếm hết chiều cao còn lại, đẩy phần dưới xuống đáy
                child: SingleChildScrollView( ¦ Cho phép cuộn khi nội dung dài hoặc bàn phím bật lên
                  child: Form( ¦ Form gom các ô nhập để kiểm tra cùng lúc
                    key: _formKey, ¦ Gắn chìa khóa để gọi validate()
                    child: Column( ¦ Cột chứa các phần của form
                      children: [ ¦ Danh sách widget con
                        const SizedBox(height: 24), ¦ Khoảng trống phía trên
                        const Text( ¦ Dòng chữ ngôn ngữ
                          'English (US)', ¦ Nội dung chữ
                          style: TextStyle(fontSize: 13, color: AppColors.textGray), ¦ Cỡ 13, màu xám
                        ), ¦ Hết Text
                        const SizedBox(height: 48), ¦ Khoảng trống 48 trước logo

                        Container( ¦ Container là hộp có thể tô màu, đặt kích thước. Dùng làm logo
                          width: 80, ¦ Rộng 80
                          height: 80, ¦ Cao 80
                          decoration: const BoxDecoration( ¦ Trang trí hộp
                            color: AppColors.blue, ¦ Tô màu xanh
                            shape: BoxShape.circle, ¦ Hình tròn
                          ), ¦ Hết BoxDecoration
                          alignment: Alignment.center, ¦ Đặt chữ vào giữa hộp
                          child: const Text( ¦ Chữ "f" trong logo
                            'f', ¦ Nội dung
                            style: TextStyle( ¦ Kiểu chữ
                              color: Colors.white, ¦ Chữ trắng
                              fontSize: 56, ¦ Cỡ chữ lớn
                              fontWeight: FontWeight.bold, ¦ In đậm
                              height: 1.1, ¦ Chiều cao dòng, giúp chữ nằm cân giữa vòng tròn
                            ), ¦ Hết TextStyle
                          ), ¦ Hết Text
                        ), ¦ Hết Container
                        const SizedBox(height: 48), ¦ Khoảng trống dưới logo

                        TextFormField( ¦ Ô nhập có hỗ trợ kiểm tra dữ liệu. Đây là ô email
                          controller: _emailController, ¦ Gắn controller để đọc chữ
                          keyboardType: TextInputType.emailAddress, ¦ Hiện bàn phím có phím @
                          decoration: _inputStyle('Mobile number or email address'), ¦ Dùng kiểu ô đã định nghĩa ở trên
                          validator: validateEmailOrPhone, ¦ Hàm kiểm tra. Trả về lỗi thì hiện chữ đỏ dưới ô
                        ), ¦ Hết ô email
                        const SizedBox(height: 12), ¦ Khoảng cách giữa hai ô

                        TextFormField( ¦ Ô mật khẩu
                          controller: _passwordController, ¦ Gắn controller
                          obscureText: _hidePassword, ¦ true thì che chữ bằng dấu chấm
                          decoration: _inputStyle( ¦ Dùng kiểu ô chung, thêm nút ở cuối
                            'Password', ¦ Nhãn của ô
                            suffix: TextButton( ¦ Nút chữ Show/Hide ở cuối ô
                              onPressed: () { ¦ Chạy khi bấm nút
                                setState(() => _hidePassword = !_hidePassword); ¦ setState báo Flutter vẽ lại. Đảo giá trị true/false

<script>
  var ORDER = ['f-main', 'f-colors', 'f-validators', 'f-home', 'f-login', 'f-signup'];
  var tabsEl = document.getElementById('tabs');
  var introEl = document.getElementById('intro');
  var tableEl = document.getElementById('table');

  function parse(text) {
    var lines = text.replace(/^\n/, '').replace(/\n$/, '').split('\n');
    return lines.map(function (raw) {
      var i = raw.indexOf(' ¦ ');
      if (i === -1) return { code: raw.trim() === '' ? '' : raw, note: '' };
      return { code: raw.slice(0, i), note: raw.slice(i + 3) };
    });
  }

  function show(id) {
    var src = document.getElementById(id);
    var rows = parse(src.textContent);
    Array.prototype.forEach.call(tabsEl.children, function (b) {
      b.setAttribute('aria-selected', b.dataset.id === id ? 'true' : 'false');
    });
    introEl.innerHTML = '';
    var strong = document.createElement('strong');
    strong.textContent = src.dataset.path;
    var p = document.createElement('p');
    p.textContent = src.dataset.intro;
    introEl.appendChild(strong);
    introEl.appendChild(p);

    tableEl.innerHTML = '';
    rows.forEach(function (r, idx) {
      var row = document.createElement('div');
      row.className = 'row' + (r.code === '' ? ' blank' : '');
      var n = document.createElement('div');
      n.className = 'num';
      n.textContent = idx + 1;
      var c = document.createElement('div');
      c.className = 'code';
      c.textContent = r.code === '' ? ' ' : r.code;
      var t = document.createElement('div');
      t.className = 'note' + (r.note ? ' has' : '');
      t.textContent = r.note;
      row.appendChild(n);
      row.appendChild(c);
      row.appendChild(t);
      tableEl.appendChild(row);
    });
  }

  ORDER.forEach(function (id) {
    var b = document.createElement('button');
    b.className = 'tab';
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.dataset.id = id;
    b.textContent = document.getElementById(id).dataset.name;
    b.addEventListener('click', function () { show(id); });
    tabsEl.appendChild(b);
  });
  show('f-main');
</script>
